[defaults]
inventory = inventory.yml
roles_path = roles
forks = 10
stdout_callback = default
result_format = yaml
retry_files_enabled = false
interpreter_python = auto_silent
host_key_checking = false

[ssh_connection]
pipelining = true
# Hosts und private IPs werden bei jedem Deploy neu vergeben → keine known_hosts-Pflege
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ServerAliveInterval=15
