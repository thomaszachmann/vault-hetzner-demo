# Feste NodePorts auf den aktiven Vault-Pod – Ziel des internen Hetzner-Load-Balancers.
# 8200 = API/UI, 8201 = Cluster-Port für die DR-Replication zwischen den Standorten.
apiVersion: v1
kind: Service
metadata:
  name: vault-lb
  namespace: vault
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: vault
    app.kubernetes.io/instance: vault
    component: server
    vault-active: "true"
  ports:
    - name: https
      port: 8200
      targetPort: 8200
      nodePort: 30200
    - name: cluster
      port: 8201
      targetPort: 8201
      nodePort: 30201
---
# Service-Account, mit dem Vault (beider Standorte) Kubernetes-Tokens dieses Clusters
# über die TokenReview-API prüft (Kubernetes Auth).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: vault
---
apiVersion: v1
kind: Secret
metadata:
  name: vault-auth-token
  namespace: vault
  annotations:
    kubernetes.io/service-account.name: vault-auth
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-auth-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault-auth
    namespace: vault
