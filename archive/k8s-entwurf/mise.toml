# Vault Enterprise Demo auf Hetzner Cloud – Kubernetes-Variante (k3s je Standort)
#
#   mise run setup     – Voraussetzungen prüfen, Offline-Root-CA einmalig erzeugen
#   mise run deploy    – komplette Umgebung aufbauen (~20 min, ~0,36 €/h)
#   mise run urls      – GUI-Übersicht (nip.io, über WireGuard)
#   mise run destroy   – alles löschen (Kosten stoppen)
#
# Alle Tasks: `mise tasks`

[tools]
terraform = "1.16.5"
hcloud = "1.70.0"
vault = "2.1.2"
kubectl = "1.36.5"
helm = "4.3.0"
jq = "1.8.2"
pandoc = "3.8.3"
typst = "0.14.2"

[env]
# Hetzner-Token kommt aus dem macOS-Schlüsselbund, nie aus einer Datei im Repo.
HCLOUD_TOKEN = { value = "{{ exec(command='security find-generic-password -s hcloud-vault-demo -w 2>/dev/null || true') }}", redact = true }
SSH_KEY = "{{ env.HOME }}/.ssh/vault-demo"
VAULT_VERSION = "2.1.2"
VAULT_CHART_VERSION = "0.34.1"
K3S_VERSION = "v1.36.5+k3s1"

[tasks.setup]
description = "Voraussetzungen prüfen und Offline-Root-CA einmalig erzeugen"
run = "scripts/setup.sh"

[tasks."ca:init"]
description = "Offline-Root-CA (simulierte behördliche PKI) erzeugen – nur einmal"
run = "scripts/ca-init.sh"

[tasks.deploy]
description = "Komplette Demo-Umgebung aufbauen"
run = "scripts/deploy.sh"

[tasks.destroy]
description = "Alle Hetzner-Ressourcen löschen und Laufzeit-Secrets entfernen"
run = "scripts/destroy.sh"

[tasks.urls]
description = "Übersicht aller GUIs und Zugänge (`-- --secrets` zeigt Passwörter)"
run = "scripts/urls.sh"

[tasks.status]
description = "Pods, Raft- und Replikationsstatus beider Cluster"
run = "scripts/status.sh"

[tasks.ssh]
description = "SSH auf einen Host über die Bastion, z. B. `mise run ssh k3s-fsn1-1`"
run = "scripts/ssh.sh"

[tasks.kubectl]
description = "kubectl gegen einen Cluster, z. B. `mise run kubectl -- nbg1 get pods -A`"
run = "scripts/kubectl.sh"

[tasks.unseal]
description = "Unseal-Vaults entsiegeln (nach Neustart eines Nodes)"
run = "scripts/unseal.sh"

[tasks."ha:node-fail"]
description = "DEMO: einen k3s-Node in fsn1 hart ausschalten (Raft-Leaderwechsel)"
run = "scripts/ha.sh fail"

[tasks."ha:node-restore"]
description = "DEMO: ausgeschalteten Node wieder einschalten"
run = "scripts/ha.sh restore"

[tasks."failover:simulate"]
description = "DEMO: Ausfall Rechenzentrum A (fsn1) – alle fsn1-Nodes ausschalten"
run = "scripts/failover.sh simulate"

[tasks."failover:promote"]
description = "DEMO: DR-Cluster nbg1 zum Primary befördern"
run = "scripts/failover.sh promote"

[tasks."failover:restore"]
description = "DEMO: fsn1 zurückholen, demoten und als DR-Secondary anhängen"
run = "scripts/failover.sh restore"

[tasks."docs:pdf"]
description = "Dokumentation als PDF erzeugen"
dir = "docs"
run = "pandoc vault-demo.md -o vault-demo.pdf --pdf-engine=typst -V papersize=a4 -V mainfont='Helvetica Neue' -V fontsize=10pt --toc -V lang=de"
